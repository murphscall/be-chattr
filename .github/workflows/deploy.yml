name: Deploy to AWS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository 파일 불러 오기
        uses: actions/checkout@v4

      - name: JDK 17 버전 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: application.yml 파일 만들기
        run: echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./src/main/resources/application.yml

      - name: gradlew 실행 권한 부여
        run: chmod +x gradlew

      - name: 애플리케이션 빌드 (테스트 제외)
        run: ./gradlew build -x test

      - name: AWS Resource에 접근할 수 있게 AWS credentials 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ap-northeast-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: ECR에 로그인하기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 및 푸시
        run:  docker build -t chattr .

      - name: Docker 이미지에 Tag 붙이기
        run: docker tag chattr ${{ steps.login-ecr.outputs.registry }}/chattr:latest

      - name: ECR에 Docker 이미지 Push하기
        run: docker push ${{ steps.login-ecr.outputs.registry }}/chattr:latest
        # 해당 Step 에서 login-ecr에서 나오는 아웃풋 값에 registry라는 값이 있다.

      - name: SCP로 EC2에 docker-compose.yml 전송 하기
        uses: appleboy/scp-action@v0.1.7 # scp 전송을 쉽게할 수 있는 라이브러리
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          source: docker-compose.yml
          target: /home/ubuntu/be-chattr

      - name: SSH로 EC2에 접속하기
        uses: appleboy/ssh-action@v1.0.3
        env:
          DB_PASS : ${{ secrets.DB_PASS }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_KEY }}
          envs: DB_PASS, DOCKER_USERNAME, DOCKER_PASSWORD , ECR_REGISTRY
          script_stop: true
          script: |
            cd /home/ubuntu/be-chattr
            
            docker compose down || true
            
            docker pull ${{ steps.login-ecr.outputs.registry }}/chattr:latest  # ecr 로 부터 이미지 pull
           
            docker compose up -d
            
            # 5. 불필요한 이전 이미지 정리
            docker image prune -f

            # 6. 배포 상태 확인 
            echo "배포 완료 컨테이너 상태 확인"
            echo "========================================"
            docker compose ps
            echo "========================================"